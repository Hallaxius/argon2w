name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun ci
      - run: bun run build
      - run: bun run typecheck
      - run: bun test --coverage --coverage-reporter=text

  node-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun ci
      - run: bun run build
      - run: npm pack --ignore-scripts
      - name: Install and smoke-test the packed package
        shell: bash
        run: |
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          cd "$temp_dir"
          npm init --yes
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/*.tgz
          node --input-type=module <<'NODE'
          import { hash, verify } from "@hallaxius/argon2w";

          const password = "node-consumer-smoke";
          const encoded = await hash(password, { profile: "experimental" });
          if (!(await verify(encoded, password))) {
            throw new Error("Node.js package consumer smoke test failed to verify a valid password");
          }
          if (await verify(encoded, "wrong-password")) {
            throw new Error("Node.js package consumer smoke test accepted a wrong password");
          }
          console.log("Packed npm package works on Node.js");
          NODE

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun audit

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker info
      - run: docker compose -f compose.argon2.yaml config
      - run: docker compose -f compose.test.yaml config

  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: compose-config
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker compose -f compose.argon2.yaml run --rm --build --no-deps native-tests

  native-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: compose-config
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker compose -f compose.argon2.yaml run --rm --build --no-deps native-sanitizers

  emscripten-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: compose-config
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker compose -f compose.argon2.yaml run --rm --build --no-deps emscripten-build

  wasm-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: compose-config
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker compose -f compose.argon2.yaml run --rm --build --no-deps wasm-tests

  phc-fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: compose-config
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker compose -f compose.argon2.yaml run --rm --build --no-deps phc-fuzz-smoke

  bun-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: compose-config
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker compose -f compose.argon2.yaml run --rm --build --no-deps bun-consumer

  resource-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: compose-config
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker compose -f compose.argon2.yaml run --rm --build --no-deps resource-smoke

  upstream-large-ram:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: compose-config
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker compose -f compose.argon2.yaml --profile large run --rm --build --no-deps upstream-large-ram
